\* Scenario: CancelConformingChain3
\* three-node chain; one lease per episode
SPECIFICATION Spec
CONSTANTS
    NumNodes = 3
    ChildScopes = {{2, 3}}
    ReadPairs = {{2, 1}, {3, 2}}
    MaxEp = 2
    MaxLeases = 1
    MaxTx = 4
    Kinds = {"coop", "uncoop"}
    CanFail = FALSE
    Composite = FALSE
    Catch = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    CancelPrompt
    NoCommitAfterCancel
    NoSetupAfterCancel
    CancelPropagatesToDependents
    SignalBeforeInverse
    NoStepAfterCancel
    NoCancelLivelock
    CaughtFailureIsolated
    CleanupBeforeNextSetup
    LeaseAccounted
    ReleaseAtMostOnce
    SingleTransaction
