\* Scenario: CancelConformingSingleComposite
\* one node; composite stage catches its failure
SPECIFICATION Spec
CONSTANTS
    NumNodes = 1
    ChildScopes = {}
    ReadPairs = {}
    MaxEp = 2
    MaxLeases = 2
    MaxTx = 2
    HeldTargets = {}
    Kinds = {"coop", "uncoop"}
    CanFail = TRUE
    Composite = TRUE
    Catch = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    CancelPrompt
    NoCommitAfterCancel
    NoSetupAfterCancel
    CancelPropagatesToDependents
    SignalBeforeInverse
    NoStepAfterCancel
    NoCancelLivelock
    CaughtFailureIsolated
    CleanupBeforeNextSetup
    LeaseAccounted
    ReleaseAtMostOnce
    SingleTransaction
