\* Scenario: CancelHeldProgress
\* the hold closes under fairness; the waiting disposal enters the queue and ends
SPECIFICATION HeldFairSpec
CONSTANTS
    NumNodes = 2
    ChildScopes = {{2}}
    ReadPairs = {{2, 1}}
    MaxEp = 2
    MaxLeases = 2
    MaxTx = 4
    HeldTargets = {{1}}
    Kinds = {"coop", "uncoop"}
    CanFail = TRUE
    Composite = FALSE
    Catch = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    HeldDisposalCompletes
