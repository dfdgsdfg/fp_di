\* Scenario: CancelConformingWideComposite
\* three-node chain; composite catches; no primitive failures
SPECIFICATION Spec
CONSTANTS
    NumNodes = 3
    ChildScopes = {{2, 3}}
    ReadPairs = {{2, 1}, {3, 2}}
    MaxEp = 2
    MaxLeases = 2
    MaxTx = 4
    HeldTargets = {}
    Kinds = {"coop", "uncoop"}
    CanFail = FALSE
    Composite = TRUE
    Catch = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    CancelPrompt
    NoCommitAfterCancel
    NoSetupAfterCancel
    CancelPropagatesToDependents
    SignalBeforeInverse
    NoStepAfterCancel
    NoCancelLivelock
    CaughtFailureIsolated
    CleanupBeforeNextSetup
    LeaseAccounted
    ReleaseAtMostOnce
    SingleTransaction
