\* Scenario: CancelHeldConforming
\* the target is held; a reader of the target; setups of other owners meanwhile
SPECIFICATION Spec
CONSTANTS
    NumNodes = 2
    ChildScopes = {{2}}
    ReadPairs = {{2, 1}}
    MaxEp = 2
    MaxLeases = 2
    MaxTx = 4
    HeldTargets = {{1}}
    Kinds = {"coop", "uncoop"}
    CanFail = TRUE
    Composite = FALSE
    Catch = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    CancelPrompt
    NoCommitAfterCancel
    NoSetupAfterCancel
    CancelPropagatesToDependents
    SignalBeforeInverse
    NoStepAfterCancel
    NoCancelLivelock
    CaughtFailureIsolated
    CleanupBeforeNextSetup
    LeaseAccounted
    ReleaseAtMostOnce
    SingleTransaction
