\* Scenario: IntegrationOwnReconcile
\* owner cancels an automatic activation; the late dispose failure reaches Scope.errors
SPECIFICATION Spec
CONSTANTS
    Cause = "owner"
    Via = "reconcile"
    Callers = {1, 2}
    LateFailsSet = {TRUE, FALSE}
    PubFailsSet = {FALSE}
    FallbackSet = {FALSE}
    Fault = "none"
INVARIANTS
    TypeOK
    RecipientsExact
    ActivationDelivered
    CallersAgree
    NoLostDisposeFailure
    ReleaseAtMostOnce
    LeaseAccounted
    SettleBeforeRollback
    NoCommitAfterCancel
    DisposalAfterRollback
    NoReactivateBeforeWithdrawal
CHECK_DEADLOCK FALSE
