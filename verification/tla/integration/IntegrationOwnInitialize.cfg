\* Scenario: IntegrationOwnInitialize
\* owner cancels an initialize; the late dispose failure reaches its caller
SPECIFICATION Spec
CONSTANTS
    Cause = "owner"
    Via = "initialize"
    Callers = {1, 2}
    LateFailsSet = {TRUE, FALSE}
    PubFailsSet = {FALSE}
    FallbackSet = {FALSE}
    Fault = "none"
INVARIANTS
    TypeOK
    RecipientsExact
    ActivationDelivered
    CallersAgree
    NoLostDisposeFailure
    ReleaseAtMostOnce
    LeaseAccounted
    SettleBeforeRollback
    NoCommitAfterCancel
    DisposalAfterRollback
    NoReactivateBeforeWithdrawal
CHECK_DEADLOCK FALSE
