# The categories follow the layers of the public API in
# specs/architecture/spec.md (Chaining and arguments). Each public type
# names its category with `{@category ...}` in its doc comment. A category
# without a markdown file has no topic page.
dartdoc:
  categoryOrder:
    - Dependency
    - Declaration
    - Keys
    - Lifecycle
    - Observation
    - Errors
  categories:
    Dependency:
      markdown: doc/dependency.md
    Declaration:
      markdown: doc/declaration.md
    Keys:
      markdown: doc/keys.md
    Lifecycle:
      markdown: doc/lifecycle.md
    Observation:
      markdown: doc/observation.md
    Errors:
      displayName: Errors and exceptions
      markdown: doc/errors.md
